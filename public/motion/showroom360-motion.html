<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Showroom 360° · tour do fluxo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- EDITAR: troque pela fonte do produto -->
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Inter:wght@400;500;600&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ═══════════════ 1. TOKENS DO PRODUTO — Showroom 360° (Figma "Fotos 360") ═══════════════ */
:root{
  --bg:#f9fafd; --surface:#ffffff; --surface2:#f6f6f6; --line:#e3e3e3;
  --accent:#375bf2; --accent-bg:#eef2ff; --blue2:#1570ef; --green:#12b76a; --yellow:#fbbf24; --red:#f04438;
  --text:#242731; --text2:#667085; --text3:#72767c; --dark:#212329;
  --font:"DM Sans",Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --page:#e7e7eb; --chrome-fg:#1a1c22; --chrome-btn:#fff; --chrome-line:#cfd0d6;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--page:#050608;--chrome-fg:#c4c4c4;--chrome-btn:#12141b;--chrome-line:#21242a;}
}
:root[data-theme="dark"]{--page:#050608;--chrome-fg:#c4c4c4;--chrome-btn:#12141b;--chrome-line:#21242a;}

/* ═══════════════ motor (normalmente não precisa mexer) ═══════════════ */
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
*{box-sizing:border-box}
body{background:var(--page);color:var(--chrome-fg);font-family:var(--font);overflow:hidden;-webkit-font-smoothing:antialiased}
body.embed{background:transparent}
#app{height:100%;display:flex;flex-direction:column}
#viewport{flex:1;min-height:0;position:relative;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;transform-origin:center;overflow:hidden;border-radius:14px;color:var(--text);
  background:radial-gradient(ellipse at 50% 40%,#f4f6fd 0%,#dde2f1 78%)}
body.rec #stage{border-radius:0}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#cursor{position:absolute;left:0;top:0;width:34px;height:40px;transform-origin:0 0;pointer-events:none;z-index:5;filter:drop-shadow(0 4px 8px rgba(0,0,0,.55))}
#ov{position:absolute;left:0;top:0;z-index:3;pointer-events:none}
#drag{position:absolute;left:0;top:0;z-index:4;pointer-events:none;display:flex;align-items:center;gap:8px;white-space:nowrap;
  background:var(--surface2);border:1px solid var(--accent);border-radius:8px;padding:8px 12px;font:500 12px ui-monospace,monospace;color:var(--text);
  box-shadow:0 14px 30px -8px rgba(0,0,0,.6);opacity:0}
.ripple{position:absolute;width:36px;height:36px;margin:-18px 0 0 -18px;border-radius:50%;border:2px solid rgba(255,255,255,.75);
  pointer-events:none;animation:rip .45s ease-out forwards;z-index:4}
@keyframes rip{from{transform:scale(.2);opacity:1}to{transform:scale(1);opacity:0}}
#screen{position:absolute;left:0;top:0;background:var(--bg);border-radius:16px;overflow:hidden;font-family:var(--font);color:var(--text);
  box-shadow:0 0 0 1px var(--line),0 60px 160px -40px rgba(78,94,254,.28),0 40px 100px -20px rgba(0,0,0,.85)}
[data-r]{transition:opacity .5s ease,filter .5s ease}
.hid{opacity:0!important;filter:blur(10px)}
/* estados reutilizáveis que a linha do tempo liga/desliga */
.focus{border-color:var(--accent)!important;box-shadow:0 0 0 2px rgba(78,94,254,.35)}
.caret{display:inline-block;width:1.5px;height:1em;background:var(--accent);margin-left:1px;opacity:0;vertical-align:middle}
.focus .caret{animation:blink 1s steps(1) infinite}
@keyframes blink{0%,50%{opacity:1}50.01%,100%{opacity:0}}
.tx{color:var(--text3)} .tx.typed{color:var(--text)}
.press{transform:scale(.96);filter:brightness(1.15)}
.hov{border-color:rgba(78,94,254,.6)!important;transform:translateY(-2px)}
.sel{background:rgba(78,94,254,.35);border-radius:2px}
.drag-over{border-color:var(--accent)!important;background:rgba(78,94,254,.06)!important}
.pop{animation:pop .45s cubic-bezier(.3,1.8,.5,1)}
@keyframes pop{0%{transform:scale(.4)}100%{transform:scale(1)}}
.enter{animation:fadeUp .3s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ═══════════════ 2. ESTILOS DA TELA — fluxo mobile ═══════════════ */
#screen{background:transparent!important;box-shadow:none!important;border-radius:0!important}
#cursor{width:34px;height:34px;margin:-17px 0 0 -17px;transform-origin:17px 17px!important;filter:drop-shadow(0 3px 6px rgba(20,24,40,.35))}
.phone{position:absolute;top:100px;width:402px;height:874px;border-radius:46px;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--font);
  box-shadow:0 0 0 9px #14161c,0 0 0 10px #2d313b,0 50px 90px -30px rgba(30,40,90,.45);transition:opacity .6s,filter .6s}
.phone.dim{opacity:.38;filter:saturate(.4)}
.sb{position:absolute;top:0;left:0;right:0;height:50px;display:flex;justify-content:space-between;align-items:center;padding:8px 36px 0;font:600 15px Inter,system-ui,sans-serif;z-index:6;color:#111}
.sb.light{color:#fff}
.sb .r{display:flex;gap:6px;align-items:center}
.notch{position:absolute;top:11px;left:50%;width:120px;height:34px;margin-left:-60px;border-radius:20px;background:#0b0c10;z-index:7}
.hi{position:absolute;bottom:8px;left:50%;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:#111;z-index:7}
.hi.light{background:#fff}
.abs{position:absolute}
.hdr{position:absolute;top:0;left:0;width:402px;background:var(--accent);border-radius:0 0 24px 24px;padding:64px 24px 24px;display:flex;flex-direction:column;gap:16px;z-index:2}
.hdr.ns{padding-bottom:24px}
.hrow{display:flex;justify-content:space-between;align-items:center;color:#fff}
.brand{display:flex;gap:8px;align-items:center;font:500 18px var(--font)}
.av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#f6a53c,#e2571e);border:.8px solid rgba(255,255,255,.55);display:grid;place-items:center;font:600 11px Inter,sans-serif;color:#fff;flex:none}
.av.s{width:24px;height:24px;font-size:9px}
.icons{display:flex;gap:16px;align-items:center}
.bellw{position:relative;display:flex}
.dotb{position:absolute;top:1px;right:2px;width:7px;height:7px;border-radius:50%;background:var(--red);box-shadow:0 0 0 1.5px var(--accent)}
.search{height:42px;border-radius:100px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 14px;font:500 14px var(--font);color:#7c7c8d;margin:0 -12px}
.top{position:absolute;left:27.5px;top:202px;width:347px;display:flex;justify-content:space-between;align-items:center}
.top h3,.ttl{font:500 18px Poppins,var(--font);margin:0;color:var(--text)}
.ib{width:32px;height:32px;border-radius:22px;background:#fff;display:grid;place-items:center;box-shadow:0 2.9px 5.8px rgba(53,53,53,.1);color:#242731}
.ib.on{background:var(--blue2);color:#fff}
.start{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;justify-content:center}
.dash{width:304px;height:152px;border:.8px dashed #d2d3d3;display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center;font:600 14px/1.5 Inter,sans-serif;color:#1f2937;letter-spacing:-.14px;color:#1f2937;transition:background .25s,border-color .25s}
.dash svg{color:var(--accent)}
.dash.on{background:var(--accent-bg);border-color:var(--accent)}
.menu{position:absolute;left:81px;top:660px;width:240px;height:64px;background:var(--dark);border-radius:22px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;color:#fff;box-shadow:0 3px 6px rgba(53,53,53,.1);z-index:3}
.camb{width:64px;height:64px;border-radius:50%;background:var(--accent);display:grid;place-items:center;transition:transform .2s,filter .2s;color:#fff}
.mcar{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px}
.plate{font:700 18px var(--font)}
.meta{font:400 12px Poppins,var(--font);color:var(--text2)}
.chips{display:flex;justify-content:flex-end;gap:10px;font:400 13px var(--font);color:var(--text2)}
.chips span{display:flex;align-items:center;gap:4px}
.chips svg{color:var(--accent)}
.load{background:#fff;border:1px solid #eaecf0;border-radius:8px;padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.thumb{width:60px;height:47px;border-radius:3px;border:.5px solid rgba(124,124,141,.4);overflow:hidden;display:grid;place-items:center;background:#fff;flex:none}
.pbar{height:7px;border-radius:16px;background:#e1effe;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--blue2);border-radius:16px;width:0}
.pt{font:500 14px var(--font);color:var(--text)}
.pd{font:500 9px var(--font);color:rgba(124,124,141,.8)}
.xbtn{width:32px;height:28px;border-radius:6px;border:1px solid var(--line);display:grid;place-items:center;color:var(--text2)}
.chdr{position:absolute;top:0;left:0;width:402px;height:112px;background:var(--accent);border-radius:0 0 24px 24px;color:#fff;z-index:2}
.chdr .back{position:absolute;left:24px;top:64px}
.chdr h4{position:absolute;left:0;right:0;top:60px;text-align:center;font:500 24px var(--font);margin:0}
.msgs{position:absolute;left:20.5px;top:136px;width:361px;display:flex;flex-direction:column;gap:8px}
.who{display:flex;gap:7px;align-items:center;font:12px Inter,sans-serif;color:var(--text3)}
.wico{width:28px;height:28px;border-radius:50%;background:#fff;border:1px solid var(--line);display:grid;place-items:center;color:var(--accent)}
.bub{background:#fff;border:1px solid var(--line);border-radius:8px;padding:16px 24px;font:16px Inter,sans-serif;color:var(--text3);align-self:flex-start;margin-left:35px;max-width:295px}
.bub.me{background:var(--accent);color:#fff;font-size:14px;align-self:flex-end;margin-left:0}
.meta-r{font:12px Inter,sans-serif;color:var(--text3);text-align:right}
.msgin{position:absolute;left:16px;top:656px;width:370px;display:flex;gap:8px;align-items:center}
.minput{flex:1;height:54px;background:#fff;border:1px solid var(--line);border-radius:100px;display:flex;align-items:center;justify-content:space-between;padding:0 20px 0 24px;font:14px Inter,sans-serif;color:var(--text3);transition:border-color .2s,box-shadow .2s}
.minput .tx{color:#72767c}.minput .tx.typed{color:var(--text)}
.send{width:42px;height:42px;border-radius:50%;background:var(--accent);display:grid;place-items:center;color:#fff;flex:none;transition:transform .15s}
.wait{opacity:0;transform:translateY(10px) scale(.98);transition:opacity .35s,transform .5s cubic-bezier(.2,1.3,.4,1)}
.wait.show{opacity:1;transform:none}
.cam{background:#000}
.vf{position:absolute;inset:0;overflow:hidden;background:linear-gradient(180deg,#dcd7cf 0,#cfc8bd 40%,#b88a5a 40%,#9a7147 70%,#7f5a36 100%)}
.vf .table{position:absolute;left:-40px;right:-40px;top:40%;height:4px;background:rgba(0,0,0,.12)}
.turn{position:absolute;left:50%;top:470px;width:300px;height:56px;margin-left:-150px;border-radius:50%;background:radial-gradient(ellipse,#f2f2f2 0,#cfcfcf 70%);box-shadow:0 10px 20px rgba(0,0,0,.25)}
.spin{position:absolute;left:50%;top:360px;width:300px;margin-left:-150px;transform-origin:50% 80%}
.cbar{position:absolute;left:0;right:0;background:rgba(0,0,0,.72);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 20px;font:500 12px Inter,sans-serif}
.timer{position:absolute;left:50%;top:92px;transform:translateX(-50%);padding:4px 10px;border-radius:6px;background:rgba(0,0,0,.45);color:#fff;font:500 15px ui-monospace,Menlo,monospace;letter-spacing:.04em;transition:background .25s;z-index:3}
.timer.rec{background:#e5372f}
.zoomp{position:absolute;left:50%;top:612px;transform:translateX(-50%);display:flex;gap:6px;padding:4px;border-radius:20px;background:rgba(0,0,0,.35)}
.zoomp span{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font:600 11px Inter,sans-serif;background:rgba(0,0,0,.35)}
.zoomp span.on{color:#ffd60a}
.shut{position:absolute;left:50%;top:716px;width:70px;height:70px;margin-left:-35px;border-radius:50%;border:4px solid #fff;display:grid;place-items:center;z-index:3}
.shut i{display:block;width:54px;height:54px;border-radius:50%;background:#ff3b30;transition:all .3s cubic-bezier(.3,1.4,.5,1)}
.shut.rec i{width:28px;height:28px;border-radius:6px}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:8;transition:opacity .35s}
.flash.on{opacity:.85;transition:none}
.vid{width:341px;height:205px;border-radius:5px;overflow:hidden;position:relative;background:#111}
.vid .sc{position:absolute;inset:0;background:linear-gradient(180deg,#bdb7ad 0,#aea79b 42%,#8e6a44 42%,#6f4f30 100%);opacity:.85}
.play{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-18px 0 0 -24px;border-radius:50%;background:var(--accent);display:grid;place-items:center;color:#fff;z-index:2}
.ts{position:absolute;left:50%;top:8px;transform:translateX(-50%);font:500 10px ui-monospace,monospace;color:#fff;background:rgba(0,0,0,.35);padding:2px 6px;border-radius:4px;z-index:2}
.pin{position:absolute;display:flex;align-items:center;gap:6px;background:#fff;border-radius:20px;padding:3px 10px 3px 3px;font:500 11px var(--font);color:var(--text);box-shadow:0 6px 14px rgba(0,0,0,.25);z-index:3;opacity:0;transform:scale(.4);transition:opacity .25s,transform .45s cubic-bezier(.3,1.7,.5,1)}
.pin b{width:18px;height:18px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:10px}
.pin.show{opacity:1;transform:none}
.lbl{position:absolute;left:0;right:0;text-align:center;font:400 10px Inter,sans-serif;color:var(--text3)}
.steps{position:absolute;left:0;top:684px;width:402px;padding:0 24px;display:flex;gap:16px}
.bt{flex:1;height:42px;border-radius:8px;display:grid;place-items:center;font:500 16px var(--font);transition:transform .15s,filter .15s}
.bt.o{background:var(--accent-bg);border:1px solid rgba(55,91,242,.5);color:var(--accent)}
.bt.p{background:var(--accent);color:#fff}
.up{background:#fff;border:.5px solid #d2d3d3;border-radius:8px;padding:12px 10px;display:flex;flex-direction:column;gap:6px}
.uprow{display:flex;justify-content:space-between;align-items:flex-start}
.upbar{display:flex;gap:9px;align-items:center;padding-left:70px}
.upbar .tr{flex:1;height:8px;border-radius:10px;background:#f6f6f6;overflow:hidden}
.upbar .tr i{display:block;height:100%;width:30%;background:var(--accent);border-radius:10px}
.upbar .tr i.ok{background:var(--green)}
.upbar small{width:28px;text-align:right;font:400 9px Inter,sans-serif;color:#797a7b}
.tico{color:var(--text2);display:flex}
.tico.ok{color:var(--green)}
.ob .title{position:absolute;left:0;right:0;top:132px;text-align:center;font:500 26px Poppins,var(--font);color:var(--text)}
.plat{position:absolute;left:21px;width:360px;height:115px;border-radius:50%;background:linear-gradient(180deg,#f4f6ff,#e6ebff);border:1px solid #dfe5ff}
.sheet{position:absolute;left:0;top:557px;width:402px;height:330px;background:var(--accent);border-radius:24px 24px 0 0;color:#fff;text-align:center}
.sheet h2{font:500 24px/1.25 Poppins,var(--font);margin:57px 16px 0}
.sheet p{font:400 15px/20px var(--font);margin:14px 24px 0}
#bStart{position:absolute;left:113px;top:789px;width:177px;height:37px;background:var(--accent-bg);border:1px solid rgba(55,91,242,.5);border-radius:8px;display:grid;place-items:center;font:500 16px var(--font);color:var(--accent);z-index:3;transition:transform .15s,filter .15s,opacity .5s}
.cap{position:absolute;left:0;right:0;top:-54px;text-align:center;font:600 20px Poppins,var(--font);color:#4b5470;letter-spacing:-.01em}
.cap small{display:block;font:500 13px var(--font);color:#8a92ab;margin-top:2px}

/* ═══════════════ controles ═══════════════ */
#bar{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;padding:12px 16px}
#bar button{font:500 13px var(--font);background:var(--chrome-btn);color:var(--chrome-fg);border:1px solid var(--chrome-line);border-radius:8px;padding:8px 12px;cursor:pointer}
#bar button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
#bar button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#bar .sep{width:1px;height:22px;background:var(--chrome-line);margin:0 4px}
#bar .hint{font-size:12px;opacity:.7;margin-left:6px}
body.rec #bar{display:none}
#note{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:rgba(18,20,27,.92);color:#c4c4c4;font-size:13px;padding:8px 14px;border-radius:8px;opacity:0;transition:opacity .4s;pointer-events:none}
#note.show{opacity:1}
</style>
</head>
<body>
<div id="app">
  <div id="viewport">
    <div id="stage">
      <div id="world"></div>
      <svg id="cursor" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="14" fill="rgba(20,24,40,.32)" stroke="#fff" stroke-width="3"/></svg>
    </div>
  </div>
  <div id="bar" role="toolbar" aria-label="Controles da animação">
    <button id="bPlay">Pausar</button><button id="bRestart">Reiniciar</button><span class="sep"></span>
    <button id="b169" aria-pressed="true">16:9</button><button id="b916" aria-pressed="false">9:16</button><span class="sep"></span>
    <button id="bSound" aria-pressed="false">Batida 120 BPM</button><button id="bRec">Modo gravação</button>
    <span class="hint">Espaço pausa · R reinicia · Esc sai do modo gravação</span>
  </div>
</div>
<div id="note">Modo gravação · Esc para sair</div>

<script>
(() => {
/* ═══════════════ 3. CONFIGURAÇÃO ═══════════════ */
const PHONES = 7, PW = 402, PH = 874, GAP = 120, PAD = 100;
const SW = PAD * 2 + PHONES * PW + (PHONES - 1) * GAP, SH = PH + PAD * 2;
const BEAT = 500;
const LOOP = 46;                     // 23 s
const ANCHOR = '#bStart';
const ANCHOR_R = 8;
const DOT = '#375bf2';
const ANCHOR_BG = '#eef2ff';
var events = [], tweens = [];

/* ═══════════════ 4. A TELA ═══════════════ */
const sv = (d, s = 24, sw = 1.8, fill = false) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" ${fill ? 'fill="currentColor"' : `fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round"`}>${d}</svg>`;
const IC = {
  bell: s => sv('<path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>', s),
  chat: s => sv('<path d="M21 12a8.5 8.5 0 0 1-12.4 7.6L3 21l1.4-5.4A8.5 8.5 0 1 1 21 12z"/><path d="M8 10h8M8 14h5"/>', s),
  search: s => sv('<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>', s, 2.2),
  home: s => sv('<path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/>', s),
  camera: s => sv('<path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.5"/>', s),
  clock: s => sv('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>', s),
  plus: s => sv('<circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/>', s),
  grid: s => sv('<rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/>', s),
  list: s => sv('<path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/>', s, 2.2),
  back: s => sv('<path d="M19 12H5M11 5l-7 7 7 7"/>', s, 2.2),

function camTo(b, sel, z, dx = 0, dy = 0) {
  ev(b, () => {
    if (sel === 'full') { cam.x.t = SW / 2; cam.y.t = SH / 2; cam.lz.t = Math.log(zFull()); return; }
    const p = pos(sel); cam.x.t = p.x + p.w / 2 + dx; cam.y.t = p.y + p.h / 2 + dy; cam.lz.t = Math.log(z);
  });
}
function curTo(b, sel, ax = .5, ay = .5, dx = 0, dy = 0) {
  ev(b, () => { const p = pos(sel); cur.x.t = p.x + p.w * ax + dx; cur.y.t = p.y + p.h * ay + dy; cur.o.t = 1; });
}
function click(b, fn) { ev(b, () => { cur.s.t = .8; ripple(); fn && fn(); }); ev(b + .2, () => { cur.s.t = 1; }); }
function dragStart(b, label) { ev(b, () => { drag.innerHTML = label; dragO.t = 1; }); }
function dragEnd(b) { ev(b, () => { dragO.t = 0; }); }
function ripple() {
  const r = document.createElement('div'); r.className = 'ripple';
  r.style.left = (cur.x.v + 3) + 'px'; r.style.top = (cur.y.v + 3) + 'px';
  world.appendChild(r); setTimeout(() => r.remove(), 500);
}

let actx = null, soundOn = false, lastHalf = -1;
function kick(t) { const o = actx.createOscillator(), g = actx.createGain(); o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(42, t + .14); g.gain.setValueAtTime(.9, t); g.gain.exponentialRampToValueAtTime(.001, t + .3); o.connect(g).connect(actx.destination); o.start(t); o.stop(t + .32); }
function hat(t) { const b = actx.createBuffer(1, Math.floor(actx.sampleRate * .05), actx.sampleRate), d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; const s = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain(); s.buffer = b; f.type = 'highpass'; f.frequency.value = 7000; g.gain.setValueAtTime(.18, t); g.gain.exponentialRampToValueAtTime(.001, t + .05); s.connect(f).connect(g).connect(actx.destination); s.start(t); }

const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
let playing = !reduce, elapsed = 0, last = performance.now();
function restart() {
  elapsed = 0; lastHalf = -1;
  events.forEach(e => e.done = false); tweens.forEach(t => t.done = false);
  world.style.width = SW + 'px'; world.style.height = SH + 'px';
  world.innerHTML = screenHTML() + '<div id="ov"></div><div id="drag"></div>';
  screen = $('#screen'); ov = $('#ov'); drag = $('#drag'); ovBig = false;
  const p = pos(ANCHOR); ovC = { x: p.x + p.w / 2, y: p.y + p.h / 2 };
  snap(cam.x, ovC.x); snap(cam.y, ovC.y); snap(cam.lz, Math.log(3.2));
  snap(ovs.w, 24); snap(ovs.h, 24); snap(ovs.r, 12); snap(ovs.o, 1); snap(dragO, 0);
  snap(cur.x, ovC.x + 240); snap(cur.y, ovC.y + 160); snap(cur.o, 0); snap(cur.s, 1);
}
function runTimeline() {
  for (const e of events) if (!e.done && elapsed >= e.t) { e.done = true; e.fn(); }
  for (const t of tweens) {
    if (t.done || elapsed < t.t0) continue;
    const p = Math.min(1, (elapsed - t.t0) / (t.t1 - t.t0));
    t.fn(t.ease(p)); if (p >= 1) t.done = true;
  }
}
function render() {
  const z = Math.exp(cam.lz.v);
  world.style.transform = `translate(${W / 2 - cam.x.v * z}px,${H / 2 - cam.y.v * z}px) scale(${z})`;
  cursorEl.style.transform = `translate(${W / 2 + (cur.x.v - cam.x.v) * z}px,${H / 2 + (cur.y.v - cam.y.v) * z}px) scale(${1.2 * cur.s.v})`;
  cursorEl.style.opacity = Math.max(0, Math.min(1, cur.o.v));
  if (ov) {
    const w = Math.max(0, ovs.w.v), h = Math.max(0, ovs.h.v);
    ov.style.width = w + 'px'; ov.style.height = h + 'px';
    ov.style.transform = `translate(${ovC.x - w / 2}px,${ovC.y - h / 2}px)`;
    ov.style.borderRadius = Math.max(0, Math.min(ovs.r.v, w / 2, h / 2)) + 'px';
    ov.style.background = (ovBig || w > 30) ? ANCHOR_BG : DOT;
    ov.style.opacity = Math.max(0, Math.min(1, ovs.o.v));
  }
  if (drag) {
    const o = Math.max(0, Math.min(1, dragO.v));
    drag.style.opacity = o;
    drag.style.transform = `translate(${cur.x.v + 14}px,${cur.y.v + 20}px) rotate(${-4 * o}deg) scale(${.9 + .1 * o})`;
  }
}
function frame(now) {
  const dt = Math.min(now - last, 50); last = now;
  if (playing) {
    elapsed += dt;
    if (elapsed >= LOOP * BEAT) restart();
    runTimeline();
    if (soundOn && actx) { const half = Math.floor(elapsed / (BEAT / 2)); if (half !== lastHalf) { lastHalf = half; half % 2 ? hat(actx.currentTime) : kick(actx.currentTime); } }
    const n = 4, hs = dt / 1000 / n;
    for (let i = 0; i < n; i++) springs().forEach(s => step(s, hs));
  }
  render();
  requestAnimationFrame(frame);
}
function fit() {
  const vp = $('#viewport'), rec = document.body.classList.contains('rec');
  const s = Math.min(vp.clientWidth / W, vp.clientHeight / H) * (rec ? 1 : .94);
  stage.style.width = W + 'px'; stage.style.height = H + 'px';
  stage.style.transform = `translate(-50%,-50%) scale(${s})`;
}
function setFormat(v) { [W, H] = v ? [1080, 1920] : [1920, 1080]; $('#b169').setAttribute('aria-pressed', !v); $('#b916').setAttribute('aria-pressed', !!v); fit(); restart(); }
function togglePlay() { playing = !playing; $('#bPlay').textContent = playing ? 'Pausar' : 'Reproduzir'; }
function setRec(on) { document.body.classList.toggle('rec', on); fit(); if (on && !document.body.classList.contains('embed')) { const n = $('#note'); n.classList.add('show'); setTimeout(() => n.classList.remove('show'), 1800); } }
$('#bPlay').onclick = togglePlay; $('#bRestart').onclick = restart;
$('#b169').onclick = () => setFormat(0); $('#b916').onclick = () => setFormat(1);
$('#bSound').onclick = () => { soundOn = !soundOn; if (soundOn && !actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { soundOn = false; } } if (actx && actx.state === 'suspended') actx.resume(); $('#bSound').setAttribute('aria-pressed', soundOn); };
$('#bRec').onclick = () => setRec(true);
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  else if (e.key === 'r' || e.key === 'R') restart();
  else if (e.key === 'h' || e.key === 'H') setRec(!document.body.classList.contains('rec'));
  else if (e.key === 'Escape') setRec(false);
});
addEventListener('resize', fit);
// ?embed esconde os controles e pausa fora da tela · &format=9x16 abre na vertical · &t=12.5 congela no segundo 12,5 (para QA)
const params = new URLSearchParams(location.search);
if (params.has('embed')) {
  document.body.classList.add('rec', 'embed');
  if ('IntersectionObserver' in window) new IntersectionObserver(([e]) => { if (!reduce) playing = e.isIntersecting; }).observe(document.body);
  document.addEventListener('visibilitychange', () => { if (!reduce) playing = !document.hidden; });
}
if (params.get('format') === '9x16') { [W, H] = [1080, 1920]; $('#b169').setAttribute('aria-pressed', false); $('#b916').setAttribute('aria-pressed', true); }
fit(); restart();
// busca determinística de tempo, usada pelo scripts/snapshot.py
window.__seek = sec => {
  restart(); playing = false; const target = sec * 1000, dt = 1000 / 60;
  while (elapsed < target) { elapsed += dt; runTimeline(); const hs = dt / 1000 / 4; for (let i = 0; i < 4; i++) springs().forEach(s => step(s, hs)); }
  render();
};
if (params.has('t')) window.__seek(parseFloat(params.get('t')));
if (!playing) $('#bPlay').textContent = 'Reproduzir';
requestAnimationFrame(frame);
})();
</script>
